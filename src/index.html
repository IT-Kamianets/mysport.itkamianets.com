<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <title>MySport</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      try {
        const storedMode = localStorage.getItem('app-mode');
        const preferredMode =
          storedMode === 'dark' || storedMode === 'light'
            ? storedMode
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.setAttribute('data-mode', preferredMode);
      } catch {}
    </script>

    <meta
      name="description"
      content="Тренування, прогнози та статистика для спортсменів. Відстежуйте прогрес, аналізуйте результати та досягайте своїх цілей."
    />
    <meta name="author" content="MySport Team" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#fcf7f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07050b" media="(prefers-color-scheme: dark)" />

    <meta itemprop="name" content="MySport" />
    <meta
      itemprop="description"
