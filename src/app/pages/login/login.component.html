<section class="mx-auto max-w-[var(--container)] px-4 py-12 sm:px-6 sm:py-16">
	<div
		class="mx-auto max-w-md rounded-[calc(var(--radius-card)*1.8)] border border-[var(--c-border)] bg-[var(--c-bg-secondary)] p-8 shadow-[var(--shadow-md)]"
	>
		<div
			class="inline-flex items-center gap-2 rounded-full border border-[var(--c-border)] bg-[var(--c-bg-tertiary)] px-3 py-1 text-xs font-semibold tracking-wider uppercase text-[var(--c-primary)]"
		>
			<span
				class="h-2 w-2 rounded-full bg-[var(--c-primary)] shadow-[0_0_8px_var(--c-primary)]"
			></span>
			<span>Авторизація</span>
		</div>

		<h1 class="mt-4 text-3xl font-extrabold tracking-tight text-[var(--c-text-strong)] sm:text-4xl">
			Login
		</h1>

		<p class="mt-2 text-sm text-[var(--c-text-muted)]">
			Вхід до особистого кабінету
		</p>

		<div class="mt-6">
			<button
				type="button"
				class="theme-interactive theme-focus flex w-full h-11 items-center justify-center rounded-[var(--radius-btn)] bg-[var(--c-primary)] px-6 text-sm font-semibold text-white shadow-[var(--shadow-sm)] hover:bg-[var(--c-primary-hover)]"
			>
				Увійти
			</button>
		</div>
	</div>
</section>
