<section class="mx-auto max-w-[var(--container)] px-4 py-12 sm:px-6 sm:py-16">
	<div
		class="relative overflow-hidden rounded-[calc(var(--radius-card)*1.8)] border border-[var(--c-border)] bg-[var(--c-bg-secondary)] p-8 shadow-[var(--shadow-md)] sm:p-12"
	>
		<div
			class="inline-flex items-center gap-2 rounded-full border border-[var(--c-border)] bg-[var(--c-bg-tertiary)] px-3 py-1 text-xs font-semibold tracking-wider uppercase text-[var(--c-primary)]"
		>
			<span
				class="h-2 w-2 rounded-full bg-[var(--c-primary)] shadow-[0_0_8px_var(--c-primary)]"
			></span>
			<span>MySport</span>
		</div>

		<h1 class="mt-4 text-4xl font-extrabold tracking-tight text-[var(--c-text-strong)] sm:text-5xl">
			Landing
		</h1>

		<p class="mt-3 max-w-xl text-base text-[var(--c-text-muted)]">
			Сторінка готова для наповнення контентом.
		</p>

		<div class="mt-6 flex flex-wrap items-center gap-3">
			<button
				type="button"
				class="theme-interactive theme-focus inline-flex h-11 items-center justify-center rounded-[var(--radius-btn)] bg-[var(--c-primary)] px-6 text-sm font-semibold text-white shadow-[var(--shadow-sm)] hover:bg-[var(--c-primary-hover)]"
			>
				Почати
			</button>
			<button
				type="button"
				class="theme-interactive theme-focus inline-flex h-11 items-center justify-center rounded-[var(--radius-btn)] border border-[var(--c-border)] bg-[var(--c-bg-primary)] px-6 text-sm font-semibold text-[var(--c-text-strong)] hover:bg-[var(--c-bg-tertiary)]"
			>
				Дізнатися більше
			</button>
		</div>
	</div>
</section>
