<div class="min-h-screen" style="background: var(--c-bg-primary)">
	<div class="mx-auto max-w-[var(--container)] px-4 py-14 sm:px-6">

		<!-- Profile header -->
		<div
			class="relative overflow-hidden rounded-[calc(var(--radius-card)*2)] border-2 border-[var(--c-border)] p-8 shadow-[var(--shadow-md)] sm:p-10"
			style="background: var(--c-bg-secondary)"
		>
			<div class="absolute inset-x-0 top-0 h-1.5" style="background: var(--c-primary)"></div>

			<!-- bg glow -->
			<div
				class="pointer-events-none absolute -top-16 -right-16 h-72 w-72 rounded-full blur-3xl opacity-25"
				style="background: var(--c-primary)"
			></div>

			<div class="relative flex flex-wrap items-center gap-6">
				<!-- Avatar -->
				<div
					class="flex h-20 w-20 shrink-0 items-center justify-center rounded-full border-4 border-[var(--c-primary)] text-3xl font-black text-white"
					style="background: var(--c-primary); box-shadow: 0 0 24px color-mix(in srgb, var(--c-primary) 60%, transparent)"
				>
					U
				</div>

				<div>
					<div
						class="inline-flex items-center gap-2 rounded-full border-2 border-[var(--c-border)] bg-[var(--c-bg-tertiary)] px-3 py-1 text-xs font-bold tracking-widest uppercase"
						style="color: var(--c-primary)"
					>
						<span
							class="h-2 w-2 rounded-full"
							style="background: var(--c-primary); box-shadow: 0 0 6px var(--c-neon)"
						></span>
						Профіль
					</div>
					<h1 class="mt-2 text-3xl font-black tracking-tight" style="color: var(--c-text-strong)">
						Особистий кабінет
					</h1>
					<p class="mt-1 text-sm" style="color: var(--c-text-muted)">
						Тут відображається інформація про користувача
					</p>
				</div>
			</div>
		</div>

		<!-- Stats -->
		<div class="mt-8 grid gap-4 sm:grid-cols-3">
			@for (stat of stats; track stat.label) {
				<div
					class="relative overflow-hidden rounded-[var(--radius-card)] border-2 border-[var(--c-border)] p-6 shadow-[var(--shadow-sm)]"
					style="background: var(--c-bg-secondary)"
				>
					<div class="absolute inset-x-0 top-0 h-1" style="background: var(--c-primary)"></div>
					<span
						class="material-symbols-outlined mb-3 block text-[32px]"
						style="color: var(--c-primary)"
					>{{ stat.icon }}</span>
					<p class="text-3xl font-black" style="color: var(--c-text-strong)">{{ stat.value }}</p>
					<p class="mt-1 text-xs font-semibold uppercase tracking-widest" style="color: var(--c-text-muted)">
						{{ stat.label }}
					</p>
				</div>
			}
		</div>

	</div>
</div>
